[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hokusai-monitoring-agent"
version = "0.1.0"
description = "Basic MTTR monitoring framework classify stage"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34",
  "httpx>=0.27",
  "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[tool.setuptools]
packages = ["agent"]

[tool.setuptools.package-data]
agent = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["agent"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore", "botocore.exceptions"]
ignore_missing_imports = true
